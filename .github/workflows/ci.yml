name: MODUL-AI | CI y build Vercel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: modul-ai-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Pruebas y compilación estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: ''
      - name: Compilar y probar
        run: npm run build
      - name: Confirmar artefactos
        run: |
          test -s public/index.html
          test -s public/dist/modul-core.mjs
          test -s public/dist/modul-studio.mjs
      - name: Resumen
        run: echo 'MODUL-AI build y pruebas ejecutadas. Vercel despliega a través de Git Integration.'
